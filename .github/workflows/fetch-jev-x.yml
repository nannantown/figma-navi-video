name: Fetch Jev X Snapshot

# Public X posts about Jev → data/jev-x-posts.json for the 07:30 JST morning
# routine (genre trial #2). The routine runs in the cloud and cannot log in to
# X, so this job reads X with the owner's X session.
#
# Owner decision 2026-09-23 (option C): the X session of the account already
# configured for local research is stored as repo secrets TWITTER_AUTH_TOKEN /
# TWITTER_CT0 and used only in the "Fetch X posts" step. This overrides, for
# this repo only, the research skill's default "cookies stay on the machine".
# The values are never printed or committed; only public post data is.
#
# Two jobs, so the session and the write token never share a job:
#   fetch  — read-only token, no git credentials left on disk, installs
#            twitter-cli from a hash-locked requirements file, gets the cookies.
#   commit — the only job with contents: write; never runs twitter-cli and
#            never sees the cookies. Takes the snapshot as an artifact.
#
# Runs only while data/content-format.json on main says "jev". Every query
# failing turns the run red: the session has most likely expired → export the
# cookies again and update both secrets (docs/jev-format.md).
#
# Verification: pull requests that touch the fetch, and workflow_dispatch with
# verify, fetch without committing.

on:
  schedule:
    # 21:07 UTC = 06:07 JST, well before the 07:30 routine; off the hour
    # because runs scheduled at :00 are the most delayed.
    - cron: "7 21 * * *"
    # 18:23 UTC = 03:23 JST, second chance.
    - cron: "23 18 * * *"
  pull_request:
    paths:
      - ".github/workflows/fetch-jev-x.yml"
      - "scripts/fetch-jev-x.mjs"
      - "scripts/fetch-jev-x.requirements.txt"
  workflow_dispatch:
    inputs:
      verify:
        description: "検証モード: 取得して artifact に保存するだけ（コミットしない）"
        type: boolean
        default: false

# Default for every job; only `commit` asks for more.
permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.verify != true) && 'fetch-jev-x-write' || format('fetch-jev-x-verify-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  WRITE_RUN: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.verify != true) && '1' || '' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      format: ${{ steps.main.outputs.format }}

    steps:
      - name: Checkout (scripts of this ref)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # main's switch and latest snapshot, whatever ref this run is on.
      - name: Checkout main's data
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-ref
          persist-credentials: false
          sparse-checkout: |
            data/content-format.json
            data/jev-x-posts.json
          sparse-checkout-cone-mode: false

      - name: Read main's format and latest snapshot
        id: main
        run: |
          set -euo pipefail
          format=$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync("main-ref/data/content-format.json","utf8")).format||"")}catch{console.log("")}')
          echo "format=$format" >> "$GITHUB_OUTPUT"
          echo "content format on main: ${format:-none}"
          if [ -f main-ref/data/jev-x-posts.json ]; then
            cp main-ref/data/jev-x-posts.json data/jev-x-posts.json
          fi

      - name: Setup Python
        if: steps.main.outputs.format == 'jev' || env.WRITE_RUN != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every package, twitter-cli's dependencies included, is pinned with its
      # sha256 (scripts/fetch-jev-x.requirements.txt, generated by uv pip
      # compile --generate-hashes). --require-hashes refuses anything else and
      # --no-deps stops pip from resolving past the lock.
      - name: Install twitter-cli (hash-locked)
        if: steps.main.outputs.format == 'jev' || env.WRITE_RUN != '1'
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/xvenv"
          "$RUNNER_TEMP/xvenv/bin/python" -m pip install --quiet --require-hashes --no-deps -r scripts/fetch-jev-x.requirements.txt
          "$RUNNER_TEMP/xvenv/bin/python" -m pip check
          echo "$RUNNER_TEMP/xvenv/bin" >> "$GITHUB_PATH"

      # twitter-cli (0.7.0, also 0.8.5 and upstream main) fetches https://x.com
      # to find the ondemand.s script it needs for the X-Client-Transaction-Id
      # header. That page no longer links it (x.com/home does), so search
      # (SearchTimeline) goes out without the header and gets a 404. Owner
      # decision 2026-09-23 (A): apply the same one-line fix as the owner's Mac.
      # The target must match exactly once before and x.com/home exactly once
      # after, otherwise the run goes red instead of silently skipping or
      # rewriting another line (docs/jev-format.md "X の取得"). No secrets here.
      - name: Patch twitter-cli (x.com -> x.com/home, one line)
        if: steps.main.outputs.format == 'jev' || env.WRITE_RUN != '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/xvenv/bin/python" - <<'PY'
          import pathlib, sys, sysconfig
          p = pathlib.Path(sysconfig.get_paths()["purelib"]) / "twitter_cli" / "client.py"
          old = '"https://x.com", headers=ct_headers,'
          new = '"https://x.com/home", headers=ct_headers,'
          src = p.read_text(encoding="utf-8")
          n_old, n_new = src.count(old), src.count(new)
          if n_old != 1 or n_new != 0:
              print(f"::error title=twitter-cli patch::expected the target line once and x.com/home zero times, found {n_old} and {n_new} in {p}. See docs/jev-format.md (X の取得)")
              sys.exit(1)
          src = src.replace(old, new)
          if src.count(old) != 0 or src.count(new) != 1:
              print("::error title=twitter-cli patch::replacement did not leave exactly one x.com/home line")
              sys.exit(1)
          p.write_text(src, encoding="utf-8")
          print(f"patched {p}: x.com -> x.com/home (1 line)")
          PY

      - name: Setup Node.js
        if: steps.main.outputs.format == 'jev' || env.WRITE_RUN != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The only step that receives the X session. No npm ci: the fetch script
      # only uses Node built-ins.
      - name: Fetch X posts
        if: steps.main.outputs.format == 'jev' || env.WRITE_RUN != '1'
        run: node scripts/fetch-jev-x.mjs
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}

      - name: Upload snapshot artifact
        if: always() && (steps.main.outputs.format == 'jev' || env.WRITE_RUN != '1')
        uses: actions/upload-artifact@v4
        with:
          name: jev-x-posts-${{ github.run_id }}
          path: data/jev-x-posts.json
          if-no-files-found: error
          retention-days: 14

  commit:
    needs: fetch
    if: needs.fetch.result == 'success' && needs.fetch.outputs.format == 'jev' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.verify != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download snapshot
        uses: actions/download-artifact@v4
        with:
          name: jev-x-posts-${{ github.run_id }}
          path: ${{ runner.temp }}/snapshot

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if ! git fetch --no-tags origin main; then
              echo "fetch attempt $i failed, retrying"
              sleep $((i * 10))
              continue
            fi
            git checkout -f -B main FETCH_HEAD
            cp "$RUNNER_TEMP/snapshot/jev-x-posts.json" data/jev-x-posts.json
            git add data/jev-x-posts.json
            if git diff --staged --quiet; then
              echo "Snapshot unchanged, nothing to commit"
              exit 0
            fi
            git commit -m "Jev X snapshot $(TZ=Asia/Tokyo date +%Y-%m-%dT%H:%M) [skip ci]"
            if git push origin main; then
              exit 0
            fi
            echo "push attempt $i failed, retrying"
            sleep $((i * 10))
          done
          echo "::error title=Jev X snapshot::push failed after 3 attempts — the snapshot was not committed"
          exit 1
