name: Fetch Product Hunt Snapshot

# Product Hunt launches → data/product-hunt-daily.json for the next morning's
# Claude Routine (07:30 JST). Runs the evening before (the last Pacific day is
# already closed, so its ranking is final) and again early morning as a second
# chance — GitHub cron can start 1-2 h late, so we never rely on a run right
# before the routine.
#
# PRODUCT_HUNT_API_TOKEN (optional secret) → official API with ranks/votes/images.
# Without it → public Atom feed (no ranking; the routine makes an editorial pick).

on:
  schedule:
    # 09:30 UTC = 18:30 JST (evening before)
    - cron: "30 9 * * *"
    # 21:30 UTC = 06:30 JST (second chance)
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      verify:
        description: "検証モード: 取得して artifact に保存するだけ（コミットしない）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-product-hunt
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm ci: the fetch script only uses Node built-ins (fetch, fs).
      - name: Fetch snapshot
        run: node scripts/fetch-product-hunt.mjs
        env:
          TZ: Asia/Tokyo
          PRODUCT_HUNT_API_TOKEN: ${{ secrets.PRODUCT_HUNT_API_TOKEN }}

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-hunt-daily-${{ github.run_number }}
          path: data/product-hunt-daily.json
          retention-days: 14

      - name: Commit snapshot (main only, skipped in verify mode)
        if: github.ref == 'refs/heads/main' && inputs.verify != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/product-hunt-daily.json
          if git diff --staged --quiet; then
            echo "Snapshot unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Product Hunt snapshot $(TZ=Asia/Tokyo date +%Y-%m-%dT%H:%M) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
