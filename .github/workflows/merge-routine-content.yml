# Merges the morning routine's content PR (routine-content-<today>) after the same
# read-only checks the routine runs (scripts/deliver-jev.mjs --prepare), then confirms
# the exact validated ledger reached main.
#
# Why here and not in the routine: the cloud routine runs in auto mode, and its
# classifier blocks "merging a pull request no human has approved" even with the
# narrow allow rule in .claude/settings.json (denied every morning 10-25..11-03).
# See docs/routine-merge-miss.md, "2026-11-03".
#
# Off switch: repo variable ROUTINE_AUTO_MERGE=off (the PR then stays open and
# 08:15 posts the next stock lesson, as before).
name: Merge routine content PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-routine-content-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      startsWith(github.head_ref, 'routine-content-') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.ROUTINE_AUTO_MERGE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The checks run main's scripts, never the PR's.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the PR head (deliver-jev reads the ledger at that SHA)
        run: git fetch --no-tags --depth=1 origin "$HEAD_SHA"
      - name: Check the PR (today's date, ledger, files, readings, not already aired from the stock)
        run: node scripts/deliver-jev.mjs --pr="$PR" --head="$HEAD_SHA" --prepare
      - name: Squash merge the checked SHA
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" -f merge_method=squash -f sha="$HEAD_SHA" --jq '{merged,message,sha}'
      - name: Confirm main has the exact validated ledger
        run: node scripts/deliver-jev.mjs --pr="$PR" --head="$HEAD_SHA"
