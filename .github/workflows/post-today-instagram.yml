name: Post Today to Instagram

# Re-post a day's Reel to Instagram only, from the exact video in Release
# v<YYYYMMDD>. Nothing is re-rendered and YouTube is never touched.
#
# Automatic (owner order 2026-10-27): four slots look again the same day —
# 12:22 / 14:22 / 17:22 / 20:22 JST. GitHub starts the 08:15 run late
# (10/19–10/26: 10:08–10:50 JST), so the slots sit after that. A slot posts only
# when the day's record has YouTube and no Instagram, daily-video.yml finished
# 45+ min ago (scripts/ig-auto-retry.mjs gate), the caption is the one the
# daily run used (scripts/day-run-captions.mjs), the video fits a Reel and the
# account does not show the day yet (… check). An earlier slot's failed upload
# is a warning (the next slot tries again); the last slot always tries and its
# failure turns the run red.
#
# By hand: gh workflow run post-today-instagram.yml [-f date=YYYYMMDD] [-f force=true]
# A push of .retry-ig-trigger on main still works (same path).

on:
  schedule:
    - cron: "22 3 * * *" # 12:22 JST
    - cron: "22 5 * * *" # 14:22 JST
    - cron: "22 8 * * *" # 17:22 JST
    - cron: "22 11 * * *" # 20:22 JST — the last slot: a failure here is red
  workflow_dispatch:
    inputs:
      date:
        description: "Date tag (YYYYMMDD). Defaults to the latest 08:15 JST post."
        required: false
        default: ""
      force:
        description: "Post even though the history already records a media id for that day (the account itself is still checked)"
        type: boolean
        required: false
        default: false
  push:
    # main only: this job posts to Instagram for real, and every branch push
    # would otherwise fire it with the production credentials.
    branches: [main]
    paths:
      - .retry-ig-trigger

permissions:
  # write: the recovery post is written back to data/performance-history.json,
  # or the media id of this post would never reach the PDCA report.
  contents: write
  actions: read # the gate lists daily-video.yml runs; day-run-captions.mjs downloads its artifact

# One retry at a time: two queued retries must not both post the same Reel.
concurrency:
  group: figma-retry-instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # generate-data.mjs cross-checks against the Product Hunt snapshot in
          # the routine's commit (a few commits back), as daily-video.yml does.
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Is this an Instagram-only failure? (record has YouTube, no Instagram)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
        run: node scripts/ig-auto-retry.mjs gate --records=data/performance-history.json --post-time=08:15 --last-slot="22 11 * * *" --force="$FORCE" ${INPUT_DATE:+"--date=$INPUT_DATE"}

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: npm ci

      - name: Download video from GitHub Release
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.gate.outputs.stamp }}
        run: |
          mkdir -p output
          gh release download "v${DATE}" -p "aitools-${DATE}.mp4" -D output/
          # Cover is optional — older releases may not have it
          gh release download "v${DATE}" -p "aitools-${DATE}-cover.jpg" -D output/ || echo "No cover asset in release"

      # The caption must be the one the video went out with. The daily run's
      # artifact keeps it; only a hand-run on an older day (artifact expired)
      # regenerates it — and then only from the same day's data.
      - name: Captions the video went out with
        if: steps.gate.outputs.go == 'true'
        env:
          TZ: Asia/Tokyo
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.gate.outputs.stamp }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if node scripts/day-run-captions.mjs --date="$DATE"; then exit 0; fi
          if [ "$EVENT" = schedule ]; then
            echo "::error title=Instagram retry stopped::not regenerating a caption on a schedule"
            exit 1
          fi
          # The video comes from a Release, the captions from the working tree. If
          # they are not the same day, the post would describe tools the video never
          # shows — stop before anything is uploaded.
          node scripts/assert-data-date.mjs "$DATE"
          node scripts/generate-data.mjs
          node scripts/generate-caption.mjs

      - name: Fits a Reel, and not on Instagram yet?
        id: check
        if: steps.gate.outputs.go == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          DATE: ${{ steps.gate.outputs.stamp }}
        run: node scripts/ig-auto-retry.mjs check --file="output/aitools-${DATE}.mp4" --captions=output/captions.json --stamp="$DATE"

      - name: Upload to Instagram (resumable)
        id: upload
        if: steps.gate.outputs.go == 'true' && steps.check.outputs.posted == 'false'
        continue-on-error: ${{ steps.gate.outputs.final != 'true' }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          DATE: ${{ steps.gate.outputs.stamp }}
        run: |
          set -euo pipefail
          # The Reels cover: this path has no audio durations to derive the
          # offset from (the mp4 comes from a Release), so read back the value
          # the daily run recorded for that day. A constant cannot do the job —
          # the first tool card starts later on a day with a long opening
          # narration, and a stale constant puts the cover back on the
          # brand-constant title card without failing anything. The script
          # warns loudly if the day predates the recording (before 2026-09-22).
          INSTAGRAM_THUMB_OFFSET_MS="$(node scripts/cover-offset-for.mjs "$DATE")"
          export INSTAGRAM_THUMB_OFFSET_MS
          echo "Using thumb_offset ${INSTAGRAM_THUMB_OFFSET_MS} ms"

          # cover_url intentionally omitted: GitHub Release assets are served
          # as Content-Type: application/octet-stream, which IG rejects with
          # code 9004. upload-instagram.mjs falls back to thumb_offset.
          node scripts/upload-instagram.mjs --file="output/aitools-${DATE}.mp4"

      - name: Not yet — the next slot tries again
        if: steps.upload.outcome == 'failure'
        run: echo "::warning title=Instagram retry::the upload failed again; a later retry slot tries the same video (the last slot turns red if it still fails)"

      # Without this the recovery post never reaches performance-history.json,
      # so the day is missing from the IG median and the saved-count that decide
      # the genre trial. Also runs when the check found the day already on
      # Instagram (a publish whose reply was lost) — its media id is recorded.
      - name: Record the post
        if: always() && steps.gate.outputs.go == 'true' && hashFiles('output/instagram-result.json') != ''
        env:
          TZ: Asia/Tokyo
          # The day being recovered, not today: recording an older post as today
          # would invent an entry for today and leave the real day unrecorded.
          RECORD_DATE: ${{ steps.gate.outputs.stamp }}
        run: |
          set -euo pipefail
          node scripts/record-upload.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if ! git fetch --no-tags origin main; then
              echo "fetch attempt $i failed, retrying"
              sleep $((i * 10))
              continue
            fi
            cp data/performance-history.json "$RUNNER_TEMP/history.json"
            git checkout -f -B main FETCH_HEAD
            cp "$RUNNER_TEMP/history.json" data/performance-history.json
            git add data/performance-history.json
            if git diff --staged --quiet; then
              echo "History unchanged, nothing to commit"
              exit 0
            fi
            git commit -m "Record recovery Instagram post [skip ci]"
            if git push origin main; then
              exit 0
            fi
            echo "push attempt $i failed, retrying"
            sleep $((i * 10))
          done
          echo "::error title=Recovery post::the post went out but the history could not be pushed — fetch-stats will restore the media id later"
          exit 1
