name: Daily AI Tools TOP5 Video

on:
  schedule:
    # 23:15 UTC = 08:15 JST (between AI Trend Daily 08:00 and Coffee 08:30)
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "検証モード: サンプルデータで動画だけ作る（投稿・コミットしない）"
        type: boolean
        default: false
      sample:
        description: "検証モードで使うサンプル（lesson = AI 仕事術 / news = AI ニュース 1 本解説 / jev-intro = Jev 説明回 / jev-usecase = Jev 使用例回 / pickup = 新作AIツール）"
        type: choice
        options:
          - lesson
          - news
          - jev-intro
          - jev-usecase
          - pickup
        default: lesson
  push:
    paths:
      - '.recovery-trigger'

permissions:
  contents: write

# The production run (main, not dry_run) shares one queue with
# post-today-instagram.yml: the daily post and an Instagram retry never post at
# the same time. queue: max — a waiting run is never cancelled by a third one
# (GitHub's default would drop the waiting 08:15 run without turning anything
# red). Verification runs (dry_run, other refs, a branch .recovery-trigger)
# get a group of their own and never wait for or replace the production run.
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' && inputs.dry_run != true) && 'sns-posting' || format('daily-video-verify-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Anything that is not the main branch is a verification run: it renders
    # from the committed sample and never posts or commits, even if someone
    # forgets to tick dry_run.
    env:
      VERIFY_RUN: ${{ (inputs.dry_run == true || github.ref != 'refs/heads/main') && '1' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Verification runs never push, so they do not keep a write token.
          persist-credentials: ${{ env.VERIFY_RUN != '1' }}
          # generate-data.mjs cross-checks against the Product Hunt snapshot in
          # the routine's commit, a few commits back; depth 1 would hide it.
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fonts + ffmpeg still come from apt (same packages, same versions, so the
      # video looks the same), but the downloaded .deb files (~300 MB) are kept in
      # actions/cache. On 2026-10-23 and 10-27 the Ubuntu mirror served them at
      # ~60 kB/s and this install ran into the job timeout, which GitHub reports
      # as "cancelled" (not red), so the day's post vanished silently. Now a normal
      # day downloads nothing, and a slow mirror fails the install step red within
      # ~5 minutes instead of eating the whole job. Notes:
      # sns-hub docs/operations/2026-10-27-apt-timeout.md
      - name: Resolve apt packages (fonts + ffmpeg)
        id: apt
        timeout-minutes: 2
        run: |
          timeout 60 sudo apt-get update
          # Cache key = hash of the exact .deb files apt would fetch: a package
          # update gives a new key (the old cache is restored, only the new .deb
          # is downloaded, then the new set is saved).
          uris=$(sudo apt-get install --print-uris -qq fonts-noto-cjk fonts-noto-cjk-extra ffmpeg)
          prefix="apt-debs-${ImageOS:-unknown}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}$(printf '%s' "$uris" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # A slow or failed restore must not eat the job: carry on and download.
      - name: Restore apt .deb cache
        id: apt-cache
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/apt-debs/*.deb
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install Japanese fonts + ffmpeg
        id: install
        timeout-minutes: 6
        run: |
          mkdir -p ~/apt-debs/partial
          apt_opts=(-o Dir::Cache::Archives="$HOME/apt-debs" -o Acquire::Retries=3)
          pkgs=(fonts-noto-cjk fonts-noto-cjk-extra ffmpeg)
          # Only the download is time-limited and retried (killing it leaves no
          # half-installed packages; finished .deb files are kept for attempt 2).
          for attempt in 1 2; do
            if timeout 120 sudo apt-get install --download-only -y "${apt_opts[@]}" "${pkgs[@]}"; then
              break
            fi
            if [ "$attempt" = 2 ]; then
              echo "::error::apt could not download fonts + ffmpeg in time (slow Ubuntu mirror?). Failing red instead of running into the job timeout."
              exit 1
            fi
            echo "::warning::apt download attempt $attempt timed out or failed; retrying (finished .deb files are kept)"
          done
          # Install once from the cache only, never touching the network.
          sudo apt-get install -y --no-download "${apt_opts[@]}" "${pkgs[@]}"
          # Drop superseded versions so the cache does not grow forever.
          sudo apt-get "${apt_opts[@]}" autoclean
          fc-cache -fv
          ffmpeg -version | head -1

      # Saved even when the install failed (under a one-off "partial" key), so
      # the .deb files that did arrive are not downloaded again next time.
      - name: Save apt .deb cache
        if: always() && steps.apt.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/apt-debs/*.deb
          key: ${{ steps.install.outcome == 'success' && steps.apt.outputs.key || format('{0}partial-{1}-{2}', steps.apt.outputs.prefix, github.run_id, github.run_attempt) }}

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        run: node scripts/pipeline.mjs
        env:
          TZ: Asia/Tokyo
          SNS_POST_ENABLED: ${{ env.VERIFY_RUN != '1' && secrets.SNS_POST_ENABLED || 'false' }}
          DRY_RUN: ${{ env.VERIFY_RUN }}
          # Production follows data/content-format.json ("lesson" since the owner
          # decision of 2026-10-22; "news" 2026-10-13..10-22; "jev" 2026-09-23..10-13).
          # Verification renders the chosen sample: a lesson, a news episode, a Jev
          # episode (intro / use case) or the pickup sample against its feed-shaped snapshot.
          CONTENT_FORMAT: ${{ env.VERIFY_RUN == '1' && (inputs.sample == 'pickup' && 'pickup' || (inputs.sample == 'lesson' || inputs.sample == '') && 'lesson' || inputs.sample == 'news' && 'news' || 'jev') || '' }}
          JEV_EPISODES_PATH: ${{ env.VERIFY_RUN == '1' && inputs.sample != 'pickup' && ((inputs.sample == 'lesson' || inputs.sample == '') && 'data/samples/ai-lesson-episodes.sample.json' || inputs.sample == 'news' && 'data/samples/ai-news-episodes.sample.json' || format('data/samples/jev-episodes.{0}.sample.json', inputs.sample == 'jev-usecase' && 'usecase' || 'intro')) || '' }}
          ENRICHED_PATH: ${{ env.VERIFY_RUN == '1' && 'data/samples/enriched-ai-tools.pickup.sample.json' || '' }}
          PH_SNAPSHOT_PATH: ${{ env.VERIFY_RUN == '1' && 'data/samples/product-hunt-daily.pickup.sample.json' || '' }}
          ALLOW_STALE_DATE: ${{ env.VERIFY_RUN }}
          # Two paused days in a row fail the run. Set the repo variable
          # ALLOW_SKIP_STREAK_UNTIL to a YYYY-MM-DD date to acknowledge a
          # genuinely quiet stretch (a long holiday); it expires by itself.
          ALLOW_SKIP_STREAK_UNTIL: ${{ vars.ALLOW_SKIP_STREAK_UNTIL }}
          # 先輩のメイ on Jev videos: repo variable MAY_CHARACTER = "on".
          # Unset (default) = off = the video looks as it did before.
          MAY_CHARACTER: ${{ vars.MAY_CHARACTER }}
          # Platform credentials only reach production runs; a verification
          # run cannot post even if a branch's pipeline ignored DRY_RUN.
          # YouTube
          YOUTUBE_CLIENT_ID: ${{ env.VERIFY_RUN != '1' && secrets.YOUTUBE_CLIENT_ID || '' }}
          YOUTUBE_CLIENT_SECRET: ${{ env.VERIFY_RUN != '1' && secrets.YOUTUBE_CLIENT_SECRET || '' }}
          YOUTUBE_REFRESH_TOKEN: ${{ env.VERIFY_RUN != '1' && secrets.YOUTUBE_REFRESH_TOKEN || '' }}
          # Instagram
          INSTAGRAM_ACCESS_TOKEN: ${{ env.VERIFY_RUN != '1' && secrets.INSTAGRAM_ACCESS_TOKEN || '' }}
          INSTAGRAM_USER_ID: ${{ env.VERIFY_RUN != '1' && secrets.INSTAGRAM_USER_ID || '' }}
          FACEBOOK_PAGE_ID: ${{ env.VERIFY_RUN != '1' && secrets.FACEBOOK_PAGE_ID || '' }}
          # Grid thumbnail: NOT pinned here. Until 2026-09-22 this was "2000",
          # which landed on the brand-constant "新作AIツール N選" title card, so
          # every day's grid tile looked identical. pipeline.mjs now derives the
          # offset from the day's audio durations (scripts/cover-frame.mjs) so
          # the cover is the first tool card — same series look, different tool
          # name and logo each day.
          # Adding INSTAGRAM_THUMB_OFFSET_MS here does override the computed
          # value (pipeline.mjs only fills it in when unset), so it stays
          # available as a kill switch — but a fixed number is what caused the
          # bug, so prefer changing the rule in cover-frame.mjs.
          # GitHub (auto-provided, used for Release creation)
          GITHUB_TOKEN: ${{ env.VERIFY_RUN != '1' && secrets.GITHUB_TOKEN || '' }}

      - name: Commit performance history
        # always(): a post that went live on one platform is recorded even when
        # the other platform failed the run.
        if: always() && env.VERIFY_RUN != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/performance-history.json
          if git diff --staged --quiet; then
            echo "No history changes"
            exit 0
          fi
          git commit -m "Update performance history [skip ci]"
          # fetch-product-hunt.yml and the routine also commit to main; rebase
          # onto them instead of losing today's upload record.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            # A failed rebase would block every later attempt.
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying"
            sleep $((i * 10))
          done
          echo "::warning title=performance history::push failed after 3 attempts — today's upload record is not on main (non-blocking; add it before the next routine, or the 30-day repeat check and the PDCA report miss this day)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aitools-video-${{ github.run_number }}${{ env.VERIFY_RUN == '1' && '-dryrun' || '' }}
          path: |
            output/aitools-*.mp4
            output/aitools-*-cover.jpg
            output/youtube-thumbnail.jpg
            output/captions.json
            output/trending-data.json
            output/skip.json
          if-no-files-found: warn
          retention-days: 30
