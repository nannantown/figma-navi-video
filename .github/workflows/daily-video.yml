name: Daily AI Tools TOP5 Video

on:
  schedule:
    # 23:15 UTC = 08:15 JST (between AI Trend Daily 08:00 and Coffee 08:30)
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "検証モード: サンプルデータで動画だけ作る（投稿・コミットしない）"
        type: boolean
        default: false
  push:
    paths:
      - '.recovery-trigger'

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Anything that is not the main branch is a verification run: it renders
    # from the committed sample and never posts or commits, even if someone
    # forgets to tick dry_run.
    env:
      VERIFY_RUN: ${{ (inputs.dry_run == true || github.ref != 'refs/heads/main') && '1' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Japanese fonts + ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra ffmpeg
          fc-cache -fv
          ffmpeg -version | head -1

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        run: node scripts/pipeline.mjs
        env:
          TZ: Asia/Tokyo
          SNS_POST_ENABLED: ${{ env.VERIFY_RUN != '1' && secrets.SNS_POST_ENABLED || 'false' }}
          DRY_RUN: ${{ env.VERIFY_RUN }}
          ENRICHED_PATH: ${{ env.VERIFY_RUN == '1' && 'data/samples/enriched-ai-tools.sample.json' || '' }}
          ALLOW_STALE_DATE: ${{ env.VERIFY_RUN }}
          # YouTube
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Instagram
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          # GitHub (auto-provided, used for Release creation)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit performance history
        if: env.VERIFY_RUN != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/performance-history.json
          if git diff --staged --quiet; then
            echo "No history changes"
            exit 0
          fi
          git commit -m "Update performance history [skip ci]"
          # fetch-product-hunt.yml and the routine also commit to main; rebase
          # onto them instead of losing today's upload record.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          echo "Push failed (non-blocking)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aitools-video-${{ github.run_number }}${{ env.VERIFY_RUN == '1' && '-dryrun' || '' }}
          path: |
            output/aitools-*.mp4
            output/aitools-*-cover.jpg
            output/captions.json
            output/trending-data.json
          if-no-files-found: warn
          retention-days: 30
